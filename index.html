  'tr-del': el => { settings.taxRates = settings.taxRates.filter(t => t.id !== el.dataset.id); menu.forEach(i => { if (i.taxId === el.dataset.id) delete i.taxId; }); saveMenu(); saveSettings(); closeModal(); renderSettings(); },
  'copy-link': () => { const u = appURL(); if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast('Link copied'); }, function () { toast('Copy it by hand: ' + u); }); else toast(u); },
  'print-qr': () => printHTML(qrCardHTML()),
  'sync-out': () => syncExport($('#sync-range').value),
  'qa-item': () => { setTab('menu'); openItemEditor(null); },
  'qa-stock': () => { ui.inv.tab = 'stock'; setTab('inventory'); openRestock(null); },
  'qa-staff': () => { setTab('team'); openStaffEditor(null); },
  'qa-popup': () => { setTab('settings'); const i = $('#new-loc'); if (i) { i.focus(); i.scrollIntoView(); } },
  'qa-cust': () => openCustEditor(null),
  'qa-gift': () => { setTab('giftcards'); openGcIssue(); },

  /* settings */
  'loc-add': () => { const inp = $('#new-loc'); if (addLocation(inp.value, false)) renderSettings(); },
  'loc-del': el => { settings.locations = settings.locations.filter(l => l !== el.dataset.v); saveSettings(); logAct('Location removed', el.dataset.v); renderLoc(); renderSettings(); },
  'st-new': () => openStaffEditor(null),
  'st-edit': el => openStaffEditor(el.dataset.id),
  'st-save': el => saveStaffForm(el.dataset.id || null),
  'dc-new': () => openDiscountEditor(null),
  'dc-edit': el => openDiscountEditor(el.dataset.id),
  'dc-save': el => saveDiscount(el.dataset.id || null),
  'dc-del': async el => {
    const d = discounts.find(x => x.id === el.dataset.id); if (!d) return;
    if (await confirmBox('Remove the discount “' + d.name + '”? Past orders keep their record.', 'Remove', true)) {
      discounts = discounts.filter(x => x !== d); saveDiscounts(); logAct('Discount removed', d.name); closeModal(); renderSettings();
    }
  },
  'qr-del': el => { settings.qr[el.dataset.v] = ''; saveSettings(); logAct('QR removed', el.dataset.v); renderSettings(); },
  backup: () => exportBackup(),
  'menu-reset': async () => {
    if (await confirmBox('Replace the whole menu with the original Crema menu? Items you added are removed. Recipes, photos and tax settings on the original items are kept.', 'Restore original', true)) {
      const old = {}; menu.forEach(i => { old[i.id] = i; });
      menu = defaultMenuGrouped().map(i => { const o = old[i.id]; if (o) { if (o.recipe) i.recipe = o.recipe; if (o.photo) i.photo = o.photo; if (o.taxId) i.taxId = o.taxId; if (o.simple) i.simple = true; } return i; });
      saveMenu(); logAct('Menu reset to original', ''); toast('Original menu restored');
    }
  },
  'ev-save': () => {
    if (addLocation($('#ev-name').value, true)) { closeModal(); setTab(ui.tab); toast('Now working in ' + settings.location); }
  }
};

const TICK = { qopt: 1, 'np-key': 1, 'more-go': 1, 'add-size': 1, item: 1, 'pin-key': 1, inc: 1, dec: 1, 'opt-inc': 1, 'opt-dec': 1, 'opt-toggle': 1, charge: 1, 'confirm-pay': 1, method: 1, disc: 1, tender: 1, prep: 1 };
function tick() { try { if (settings.haptic !== false && navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
document.addEventListener('click', function (e) {
  const tp = e.target.closest('[data-tip]');           /* charts: tap a bar or square to read its numbers */
  if (tp) { const card = tp.closest('.acard'), box = card && $('.tipbox', card); if (box) { box.textContent = tp.dataset.tip; box.classList.add('on'); } }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (TICK[act]) tick();
  /* a form or payment window is never closed by an accidental tap outside it */
  if (act === 'overlay') { if (e.target === el && !$('#modal-root .modal').querySelector('input,select,textarea')) closeModal(); return; }
  if (act === 'overlay-top') { if (e.target === el) dismissTop(); return; }
  if (handlers[act]) handlers[act](el, e);
});

function onFieldInput(e) {
  const t = e.target;
  if (t.id === 'search') { ui.search = t.value; renderGrid(); }
  else if (t.id === 'ref') { cart.ref = t.value; }
  else if (t.id === 'cs-cash') { updateCloseDiff(); }
  else if (t.dataset.bind) { onBind(t); }
  else if (t.dataset.setting) { onSettingChange(t, false); }
  else if (t.dataset.tx === 'q') { ui.tx.q = t.value; renderTxBody(); }
  else if (t.dataset.ex === 'q') { ui.exp.q = t.value; renderExpBody(); }
  else if (t.dataset.inv === 'q') { ui.inv.q = t.value; renderInvBody(); }
  else if (t.dataset.cu === 'q') { ui.cust.q = t.value; renderCustBody(); }
  else if (t.dataset.gc === 'q') { ui.gc.q = t.value; renderGiftCards(); const i = $('[data-gc=q]'); if (i) { i.focus(); i.setSelectionRange(t.value.length, t.value.length); } }
  else if (t.dataset.tm === 'q') { ui.team.q = t.value; renderTeamBody(); }
  else if (t.dataset.dxq) { ui.data.q = t.value; renderDataBody(); }
  else if (t.dataset.au === 'q') { ui.audit.q = t.value; renderAuditBody(); }
  else if (t.id === 'rs-qty' || t.id === 'rs-cost') { updateRestockPreview(); }
  else if (t.classList && t.classList.contains('rqi')) { updateRecipeSummary(); }
}
document.addEventListener('input', onFieldInput);

/* number pad: fields that take amounts open the on-screen pad instead of the phone keyboard */
document.addEventListener('pointerdown', function (e) {
  const t = e.target;
  if (usePad() && padKind(t)) { if (!t.dataset.im) t.dataset.im = t.getAttribute('inputmode'); t.setAttribute('inputmode', 'none'); t.readOnly = true; }
}, true);
document.addEventListener('focusin', function (e) {
  const t = e.target;
  if (usePad() && padKind(t)) { openPad(t); return; }
  if (padTarget && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) && !t.closest('#numpad')) closePad();
});

document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.id === 'loc') {
    if (t.value === '__new') {
      renderLoc();
      openModal('<h2>New pop-up event</h2><label class="f"><span>Event name</span><input id="ev-name" data-focus autocomplete="off" placeholder="e.g. Night Market, Dec 20"></label>' +
        '<div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="ev-save">Add event</button></div>');
      return;
    }
    settings.location = t.value; ui.tx.loc = t.value; saveSettings();
    updateBadge(); setTab(ui.tab);
  } else if (t.dataset.tx && t.dataset.tx !== 'q') {
    ui.tx[t.dataset.tx] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.tx === 'period') renderSales(); else renderTxBody();
  } else if (t.id === 'st-role') {
    const dd = $('#st-roledesc'); if (dd) dd.textContent = (ROLES[t.value] || { desc: '' }).desc + ' See the full table under Team → What each role can do.';
  } else if (t.id === 'ex-cat') {
    const wrap = $('#ex-newwrap'); if (wrap) { wrap.hidden = t.value !== '__new'; if (t.value === '__new') { const n = $('#ex-newcat'); if (n) n.focus(); } }
  } else if (t.id === 'imp-exp' && t.files && t.files[0]) {
    readFileText(t.files[0], importExpensesCSV); t.value = '';
  } else if (t.id === 'imp-cust' && t.files && t.files[0]) {
    readFileText(t.files[0], importCustomersCSV); t.value = '';
  } else if (t.dataset.sel) {
    ui.tx.sel[t.dataset.sel] = t.checked; const sb = $('#sel-bar'); if (sb) sb.innerHTML = selBarHTML();
  } else if (t.dataset.dx) {
    dxEdit(t);
  } else if (t.dataset.tm && t.dataset.tm !== 'q') {
    ui.team[t.dataset.tm] = t.value; renderTeamBody();
  } else if (t.dataset.au && t.dataset.au !== 'q') {
    ui.audit[t.dataset.au] = t.value; renderAudit();
  } else if (t.id === 'pr-period') {
    prCtx.period = t.value; $('#pr-body').innerHTML = payrollHTML();
  } else if (t.id === 'st-photo' && t.files && t.files[0]) {
    fileToDataURL(t.files[0], 160, function (url) { stPhoto = url; const a = $('#st-av'); if (a) a.innerHTML = avatarHTML({ name: '?', photo: url }); }, 'image/jpeg');
  } else if (t.id === 'it-photo' && t.files && t.files[0]) {
    fileToDataURL(t.files[0], 220, function (url) { itPhoto = url; const a = $('#it-ph'); if (a) a.innerHTML = '<img class="thumb big" src="' + url + '" alt="">'; }, 'image/jpeg');
  } else if (t.id === 'imp-dx' && t.files && t.files[0]) {
    readFileText(t.files[0], DX[ui.data.table].imp); t.value = '';
  } else if (t.id === 'sync-in' && t.files && t.files[0]) {
    importSync(t.files[0]); t.value = '';
  } else if (t.dataset.ex && t.dataset.ex !== 'q') {
    ui[ 'exp' ][t.dataset.ex] = t.value; renderExpBody();
  } else if (t.dataset.inv && t.dataset.inv !== 'q') {
    ui.inv[t.dataset.inv] = t.type === 'checkbox' ? t.checked : t.value; renderInvBody();
  } else if (t.dataset.an) {
    ui.an[t.dataset.an] = t.value; renderAnalytics();
  } else if (t.id === 'rs-ing') {
    updateRestockPreview();
  } else if (t.classList && t.classList.contains('ri')) {
    updateRecipeSummary();
  } else if (t.id === 'imp-ing' && t.files && t.files[0]) {
    readFileText(t.files[0], importIngredientsCSV); t.value = '';
  } else if (t.id === 'imp-menu' && t.files && t.files[0]) {
    readFileText(t.files[0], importMenuCSV); t.value = '';
  } else if (t.dataset.setting) {
    onSettingChange(t, true);
  } else if (t.dataset.bind) {
    onBind(t);
  } else if (t.dataset.qr && t.files && t.files[0]) {
    const m = t.dataset.qr;
    fileToDataURL(t.files[0], 700, function (url) { settings.qr[m] = url; saveSettings(); logAct('QR uploaded', m); renderSettings(); });
  } else if (t.id === 'restore' && t.files && t.files[0]) {
    importBackup(t.files[0]); t.value = '';
  }
});

document.addEventListener('keydown', function (e) {
  if (pinCtx) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); pinPress(e.key); return; }
    if (e.key === 'Backspace') { e.preventDefault(); pinDel(); return; }
    if (e.key === 'Escape') { dismissTop(); return; }
  }
  if (e.key === 'Escape') {
    if ($('#modal-top').firstChild) dismissTop();
    else if ($('#modal-root').firstChild) closeModal();
    return;
  }
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'search') {                            /* barcode scanners "type" the code then press Enter */
    const q = e.target.value.trim(); if (!q) return;
    const byCode = menu.find(i => i.barcode && i.barcode === q);
    const matches = visibleItems();
    const pick = byCode || (matches.length === 1 ? matches[0] : null);
    if (pick) { pickItem(pick); ui.search = ''; e.target.value = ''; renderGrid(); }
    else toast('No single item matches');
  } else if (id === 'opt-note') { saveOptions(); }
  else if (id === 'e-name' || id === 'e-code') { const b = $('#modal-root [data-act="item-save"]'); if (b) handlers['item-save'](b); }
  else if (id === 'ev-name') { handlers['ev-save'](); }
  else if (id === 'os-cash') { openShiftSave(); }
  else if (id === 'cs-cash') { closeShiftSave(); }
  else if (id === 'su-pin2') { createOwner(); }
  else if (id === 'p-gc') { gcCheck(); }
});

/* =====================================================================
   13. START
   ===================================================================== */
function enter() {
  applyTheme(); buildNav(); renderUser(); updateBell(); showWarn();
  if (!canSee(ui.tab)) ui.tab = firstTab();
  setTab(ui.tab);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
applyTheme();
applyWake();
showWarn();
renderLoc();
restoreSession();
if (!staff.length) showSetup();
else if (!me) showLock();
else enter();

/* running clocks on the queue, offline indicator, offline copy of the app */
setInterval(tickTimers, 1000);
function updateNet() { const n = $('#net'); if (n) n.hidden = navigator.onLine !== false; }
window.addEventListener('online', function () { updateNet(); toast('Back online'); if (ui.tab === 'settings') renderSettings(); });
window.addEventListener('offline', function () { updateNet(); toast('You are offline. Sales keep saving on this device.'); if (ui.tab === 'settings') renderSettings(); });
updateNet();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  const hadWorker = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadWorker) toast('A new version was installed. It is used the next time you open the app.'); });
}

/* Android and iPhone/iPad: install prompt, back button, screen awake */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (ui.tab === 'settings') renderSettings(); });
window.addEventListener('appinstalled', function () { installEvt = null; toast('App installed'); if (ui.tab === 'settings') renderSettings(); });
(function () { const ai = document.querySelector('link[rel=apple-touch-icon]'); if (ai && ai.dataset.fallback && !/^https?:/.test(location.protocol)) ai.href = ai.dataset.fallback; })();
if (isStandalone()) {
  /* inside the installed app the Back button must not close it in the middle of an order */
  try { history.pushState({ crema: 1 }, ''); } catch (e) {}
  window.addEventListener('popstate', function () {
    try { history.pushState({ crema: 1 }, ''); } catch (e) {}
    if ($('#modal-top').firstChild) dismissTop(); else if ($('#modal-root').firstChild) closeModal(); else toast('Use the menu to switch screens');
  });
}
function applyWake() {
  try {
    if (settings.keepAwake && navigator.wakeLock && document.visibilityState !== 'hidden') {
      if (!wakeLock && !wakePending) { wakePending = true; navigator.wakeLock.request('screen').then(function (l) { wakePending = false; wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }, function () { wakePending = false; }); }
    } else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) { wakePending = false; }
}
document.addEventListener('visibilitychange', applyWake);

/* lock the screen when nobody has touched it for a while */
let lastAct = Date.now();
['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
setInterval(function () {
  const m = Number(settings.idleLock) || 0;
  if (m > 0 && me && !pinCtx && Date.now() - lastAct > m * 60000) { lastAct = Date.now(); lockApp(); }
}, 15000);

/* keep the queue fresh and the badge up to date */
setInterval(function () {
  if (!me) return;
  updateBadge();
  if (ui.tab === 'queue' && !$('#modal-root').firstChild && !$('#modal-top').firstChild) renderQueue();
}, 30000);
})();

</script>
</body>
</html>
